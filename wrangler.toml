name = "c3-quiz"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静态资源(题库 + 前端)
[assets]
directory = "./public"
binding = "ASSETS"
# 真实文件直接返回,不存在时交给 Worker 处理(不要 SPA fallback,
# 否则 admin.html 会被 307 到 index.html)
not_found_handling = "none"

# KV 存储(用户表 / 会话 / 进度)
[[kv_namespaces]]
binding = "C3_KV"
id = "665dc7304bd1407a9b8015c1e557705b"

[observability]
enabled = true
