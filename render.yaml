services:
  - type: web
    name: c3-quiz
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8787
      - key: HOST
        value: 0.0.0.0
      # ⚠️ 部署后必须在 Render 后台填,不要写在这里
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
    # 注意:free 套餐不支持 disk。
    # 刷题进度存在容器的 data/_progress,容器重启会丢 —— 可接受。
    # 需要持久化请升级到 paid 套餐并加回 disk 配置。
